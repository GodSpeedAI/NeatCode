name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
          # Release Please bumps package.json by default. These extra files hold
          # the same version string and must move in lockstep, or the skill's
          # integrity test (SKILL.md version == package.json version) fails.
          extra-files: |
            skills/neatcode/SKILL.md
            .claude-plugin/plugin.json
