name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # release-type and extra-files live in release-please-config.json now —
          # skills/neatcode/SKILL.md and .claude-plugin/plugin.json hold the same
          # version string and must move in lockstep, or the skill's integrity
          # test (SKILL.md version == package.json version) fails.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A release created with the default GITHUB_TOKEN can't trigger other
          # workflows (GitHub's anti-recursion guard), so publish.yml's
          # `on: release: published` would never fire. A PAT sidesteps that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
